# Render Blueprint for LÁTIRA 2.0 (Core Lightweight Backend + Static Frontend)
# Note: YOLO Pose + PyTorch (~723.8 MiB Peak RSS) exceeds Render Free/Starter 512 MiB RAM.
# This blueprint deploys the core backend in lightweight mode (safe for 512 MiB) and the Vite static frontend.
# See docs/INFORME_AUDITORIA_RENDER.md for Persistent Disk, 2 GB+ Standard tier, and decoupled vision options.

services:
  - type: web
    name: latira-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LATIRA_ENV
        value: production
      - key: LATIRA_DEMO_LOGIN
        value: "false"
      - key: LATIRA_MODE
        value: light
      - key: LATIRA_SKIP_YOLO_SETUP
        value: "1"
      - key: LATIRA_DB_PATH
        value: /tmp/latira_data/latira.sqlite3
      - key: POSE_STORAGE_DIR
        value: /tmp/latira_data/pose
      - key: POSE_HISTORY_DB
        value: /tmp/latira_data/pose/history.sqlite3
      - key: LATIRA_THERMAL_DIR
        value: /tmp/latira_data/thermography
      - key: LATIRA_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LATIRA_LLM_MODEL
        value: gemini-4-hydrogen

  - type: web
    name: latira-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
